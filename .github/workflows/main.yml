name: Build, attest, and release DLLs

on:
  workflow_dispatch:
  push:
    branches:
      - "actions-build"
    tags:
      - "[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-2025

    steps:
      - name: Check out xv2patcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: xv2patcher

      - name: Check out eternity_common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eterniti/eternity_common
          ref: 252d52b1d77d2bafe918ecdb143530b54e7edb31
          path: eternity_common

      - name: Set up the GitHub build runner
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            curl
            mingw-w64-x86_64-gcc
            
      - name: Install pinned MinHook package
        shell: msys2 {0}
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/MinHook.pkg.tar.zst \
            "https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-MinHook-1.3.4-2-any.pkg.tar.zst"

          echo "b4726992ee0b7785b04a3525caca638f030f147b80e1486188397de0f0ffa47f  /tmp/MinHook.pkg.tar.zst" \
            | sha256sum --check -

          pacman --noconfirm -U /tmp/MinHook.pkg.tar.zst

      - name: Display compiler and dependency versions
        shell: msys2 {0}
        run: |
          gcc --version
          g++ --version
          pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-MinHook

      - name: Compile xinput1_3.dll and dinput8.dll
        shell: msys2 {0}
        working-directory: xv2patcher
        run: |
          mkdir -p release

          make clean
          make -j2
          test -f xinput1_3.dll
          cp xinput1_3.dll release/

          make clean
          make -f Makefile.dinput8 -j2
          test -f dinput8.dll
          cp dinput8.dll release/

          cd release
          sha256sum xinput1_3.dll dinput8.dll > SHA256SUMS.txt

      - name: Attest xinput1_3.dll
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: xv2patcher/release/xinput1_3.dll

      - name: Attest dinput8.dll
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: xv2patcher/release/dinput8.dll

      - name: Create draft release and attach files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "xv2patcher/release/xinput1_3.dll" `
            "xv2patcher/release/dinput8.dll" `
            "xv2patcher/release/SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --draft `
            --title "XV2 Patcher Online compatibility build $env:RELEASE_TAG" `
            --notes "Community compatibility build based on Eternity's xv2patcher. Both DLL variants were compiled through the public GitHub Actions workflow and include cryptographic build provenance. Use only one DLL variant at a time." `
            --generate-notes

      - name: Publish immutable release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --draft=false
